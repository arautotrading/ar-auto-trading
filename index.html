<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">

<title>AR AUTO TRADING | Vehicle & Machinery Buying</title>

<meta name="description"
content="AR AUTO TRADING buys and trades used cars, imported vehicles, trucks, construction machinery, accident-damaged vehicles and non-running vehicles. Get in touch for a valuation.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>
:root {
  --black: #080808;
  --black-soft: #111111;
  --panel: #171717;
  --gold: #d6ad58;
  --gold-light: #f3d895;
  --white: #ffffff;
  --muted: #b8b8b8;
  --border: rgba(214,173,88,.25);
  --max-width: 1200px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  font-family: "Noto Sans JP", sans-serif;
  background: var(--black);
  color: var(--white);
  line-height: 1.7;
}

body, button, input, select, textarea {
  font-family: "Noto Sans JP", sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

button, input, select, textarea {
  font-size: 16px;
}

button {
  cursor: pointer;
}

.container {
  width: min(var(--max-width), 92%);
  margin-inline: auto;
}

.gold {
  color: var(--gold);
}

.eyebrow {
  color: var(--gold);
  font-size: .78rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  font-weight: 700;
}

.section {
  padding: 90px 0;
}

.section-heading {
  text-align: center;
  max-width: 760px;
  margin: 0 auto 45px;
}

.section-heading h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 600;
  line-height: 1.15;
  margin: 12px 0 16px;
}

.section-heading p {
  color: var(--muted);
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  padding: 14px 23px;
  border-radius: 3px;
  font-weight: 700;
  text-align: center;
  border: 1px solid transparent;
  transition: .25s ease;
}

.btn-gold {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #111;
}

.btn-gold:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
}

.btn-outline {
  border-color: var(--gold);
  color: var(--gold-light);
  background: rgba(0,0,0,.25);
}

.btn-outline:hover {
  background: var(--gold);
  color: #111;
}

.btn-dark {
  background: #181818;
  border-color: #333;
  color: white;
}

.btn-dark:hover {
  border-color: var(--gold);
}

/* HEADER */

.site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(7,7,7,.96);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
}

.header-inner {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-mark {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: "Cormorant Garamond", serif;
  font-size: 1.55rem;
  font-weight: 700;
  transform: skew(-4deg);
}

.brand-name {
  font-size: .97rem;
  font-weight: 800;
  letter-spacing: .11em;
  line-height: 1.3;
}

.brand-caption {
  color: var(--gold);
  font-size: .62rem;
  letter-spacing: .17em;
  margin-top: 3px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 13px;
}

.header-contact {
  padding: 10px 15px;
  font-size: .85rem;
}

.language-switch {
  background: transparent;
  color: var(--gold-light);
  border: 1px solid var(--border);
  padding: 9px 11px;
  border-radius: 3px;
  font-weight: 700;
}

.nav {
  display: flex;
  align-items: center;
  gap: 24px;
}

.nav a {
  font-size: .82rem;
  color: #e7e7e7;
  transition: color .2s;
}

.nav a:hover {
  color: var(--gold);
}

.mobile-menu {
  display: none;
  color: var(--gold);
  border: 1px solid var(--border);
  background: transparent;
  padding: 8px 11px;
  border-radius: 3px;
}

/* HERO */

.hero {
  position: relative;
  min-height: 650px;
  display: flex;
  align-items: center;
  overflow: hidden;
  background:
    linear-gradient(90deg,
      rgba(4,4,4,.96) 0%,
      rgba(4,4,4,.83) 40%,
      rgba(4,4,4,.30) 100%),
    url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=2200&q=85")
    center 55% / cover no-repeat;
}

.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 130px;
  background: linear-gradient(transparent, var(--black));
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 690px;
  padding: 90px 0 120px;
}

.hero-kicker {
  display: inline-block;
  border-left: 3px solid var(--gold);
  padding-left: 13px;
  color: var(--gold-light);
  letter-spacing: .17em;
  font-size: .8rem;
  font-weight: 700;
  margin-bottom: 23px;
}

.hero h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(3.2rem, 7vw, 6.5rem);
  line-height: .98;
  font-weight: 700;
  letter-spacing: -.025em;
  max-width: 750px;
}

.hero h1 span {
  color: var(--gold);
}

.hero h2 {
  margin-top: 22px;
  font-size: clamp(1.05rem, 2.2vw, 1.45rem);
  font-weight: 600;
  letter-spacing: .02em;
}

.hero p {
  margin-top: 15px;
  max-width: 550px;
  color: #d2d2d2;
  font-size: .98rem;
}

.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 32px;
}

.hero-note {
  color: #c5c5c5;
  font-size: .78rem;
  margin-top: 22px;
}

/* TRUST STRIP */

.trust-strip {
  position: relative;
  z-index: 3;
  background: #101010;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.trust-item {
  padding: 25px 12px;
  text-align: center;
  border-right: 1px solid #292929;
}

.trust-item:last-child {
  border-right: none;
}

.trust-item strong {
  display: block;
  color: var(--gold);
  font-size: 1rem;
  margin-bottom: 4px;
}

.trust-item span {
  color: #c3c3c3;
  font-size: .78rem;
}

/* SERVICES */

.services-section {
  background: var(--black);
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.service-card {
  background: #121212;
  border: 1px solid #292929;
  overflow: hidden;
  transition: transform .3s, border-color .3s;
}

.service-card:hover {
  transform: translateY(-5px);
  border-color: var(--gold);
}

.service-image {
  position: relative;
  height: 225px;
  overflow: hidden;
  background: #222;
}

.service-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .5s;
}

.service-card:hover .service-image img {
  transform: scale(1.05);
}

.service-image::after {
  content: "";
  position: absolute;
  inset: 40% 0 0;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
}

.service-number {
  position: absolute;
  z-index: 1;
  bottom: 13px;
  left: 18px;
  color: var(--gold-light);
  font-family: "Cormorant Garamond", serif;
  font-size: 1.7rem;
}

.service-body {
  padding: 22px;
}

.service-body h3 {
  font-size: 1.08rem;
  margin-bottom: 9px;
}

.service-body p {
  color: var(--muted);
  font-size: .88rem;
}

.text-link {
  display: inline-block;
  color: var(--gold);
  font-size: .85rem;
  font-weight: 700;
  margin-top: 17px;
}

.text-link:hover {
  color: var(--gold-light);
}

/* BUYING BANNER */

.buy-banner {
  padding: 72px 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.94), rgba(0,0,0,.70)),
    url("https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=1800&q=85")
    center / cover no-repeat;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.buy-banner-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 35px;
}

.buy-banner h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(2.1rem, 4.5vw, 3.5rem);
  line-height: 1.1;
  margin: 10px 0 16px;
}

.buy-banner p {
  max-width: 720px;
  color: #d0d0d0;
}

.buy-banner .btn {
  flex-shrink: 0;
}

/* WHY US */

.why-section {
  background: #101010;
}

.why-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.why-card {
  padding: 28px;
  background: #151515;
  border: 1px solid #292929;
}

.why-icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-size: 1.25rem;
  margin-bottom: 20px;
}

.why-card h3 {
  margin-bottom: 10px;
  font-size: 1.02rem;
}

.why-card p {
  color: var(--muted);
  font-size: .88rem;
}

/* GALLERY */

.gallery-grid {
  display: grid;
  grid-template-columns: 1.35fr 1fr 1fr;
  grid-template-rows: 210px 210px;
  gap: 14px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  background: #222;
}

.gallery-item:first-child {
  grid-row: span 2;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s;
}

.gallery-item:hover img {
  transform: scale(1.06);
}

.gallery-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 28px 15px 13px;
  background: linear-gradient(transparent, rgba(0,0,0,.85));
  font-weight: 700;
  font-size: .9rem;
}

/* ENQUIRY SECTION */

.enquiry-section {
  background:
    radial-gradient(ellipse at 10% 0%, rgba(214,173,88,.08), transparent 40%),
    #0b0b0b;
}

.enquiry-layout {
  display: grid;
  grid-template-columns: .85fr 1.35fr;
  gap: 35px;
  align-items: start;
}

.enquiry-intro {
  padding: 30px;
  background: #141414;
  border: 1px solid var(--border);
}

.enquiry-intro h3 {
  font-family: "Cormorant Garamond", serif;
  font-size: 2.2rem;
  line-height: 1.1;
  margin: 15px 0;
}

.enquiry-intro > p {
  color: var(--muted);
  font-size: .9rem;
}

.benefit-list {
  list-style: none;
  margin: 24px 0;
}

.benefit-list li {
  padding: 11px 0;
  border-bottom: 1px solid #292929;
  font-size: .9rem;
}

.benefit-list li::before {
  content: "✓";
  color: var(--gold);
  margin-right: 11px;
  font-weight: 800;
}

.contact-direct {
  margin-top: 25px;
  width: 100%;
}

.contact-details {
  display: none;
  margin-top: 15px;
  padding: 16px;
  background: #0b0b0b;
  border: 1px solid var(--border);
}

.contact-details.show {
  display: block;
}

.contact-details p {
  color: var(--muted);
  font-size: .83rem;
  margin-bottom: 12px;
}

.contact-details .btn {
  width: 100%;
  margin-top: 8px;
}

/* FORM */

.form-panel {
  background: #131313;
  border: 1px solid #303030;
  padding: 32px;
}

.form-panel h3 {
  font-size: 1.35rem;
  margin-bottom: 7px;
}

.form-description {
  color: var(--muted);
  font-size: .87rem;
  margin-bottom: 25px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.form-field {
  min-width: 0;
}

.form-field.full {
  grid-column: 1 / -1;
}

.form-field label {
  display: block;
  font-size: .83rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: #eee;
}

.required {
  color: var(--gold);
  font-size: .72rem;
  margin-left: 5px;
}

.form-field input,
.form-field select,
.form-field textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 13px;
  background: #090909;
  color: #fff;
  border: 1px solid #3b3b3b;
  border-radius: 3px;
  outline: none;
}

.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(214,173,88,.10);
}

.form-field select option {
  background: #111;
}

.form-field textarea {
  min-height: 120px;
  resize: vertical;
}

.field-note {
  font-size: .74rem;
  color: #aaa;
  margin-top: 7px;
}

.photo-drop {
  padding: 23px;
  border: 1px dashed #68604e;
  background: #0d0d0d;
  text-align: center;
}

.photo-drop p {
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: 13px;
}

.photo-drop input {
  border: none;
  padding: 8px 0;
  min-height: auto;
  background: transparent;
}

.photo-preview {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.photo-preview img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  border: 1px solid #333;
}

.consent-note {
  color: #aaa;
  font-size: .75rem;
  margin: 18px 0;
}

.submit-button {
  width: 100%;
  min-height: 52px;
  border: none;
  font-weight: 800;
  letter-spacing: .04em;
}

.submit-button:disabled {
  opacity: .6;
  cursor: wait;
}

.form-status {
  display: none;
  margin-top: 16px;
  padding: 13px;
  border-radius: 3px;
  font-size: .85rem;
  overflow-wrap: anywhere;
}

.form-status.show {
  display: block;
}

.form-status.success {
  background: #102317;
  border: 1px solid #2c7747;
  color: #c3f5d3;
}

.form-status.error {
  background: #2a1111;
  border: 1
