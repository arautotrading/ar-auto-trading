<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>AR AUTO TRADING</title>
<meta name="description" content="AR AUTO TRADING - Vehicle enquiries in Japanese and English.">

<style>
:root {
  --gold: #d9b45b;
  --gold-light: #f3dda0;
  --background: #101010;
  --panel: #1b1b1b;
  --text: #f8f5ed;
  --muted: #bdb7a9;
  --red: #e84d3d;
  --border: #393329;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

button, input, select, textarea { font: inherit; }

button { cursor: pointer; }

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(16,16,16,.97);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1150px;
  margin: auto;
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold-light);
  text-decoration: none;
  font-size: clamp(16px, 3vw, 25px);
  font-weight: 900;
  letter-spacing: 1px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 2px solid var(--gold);
  border-radius: 50%;
  color: var(--gold);
  font-size: 19px;
}

.language-switch {
  display: flex;
  gap: 5px;
}

.language-switch button {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 12px;
  color: white;
  background: #222;
}

.language-switch button.active {
  background: var(--gold);
  color: #17130a;
  font-weight: bold;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 22px 18px 55px;
}

.hero {
  padding: 36px 25px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background:
    radial-gradient(ellipse at top right, #483a1d, transparent 60%),
    linear-gradient(135deg, #211e17, #111);
  margin-bottom: 28px;
}

.eyebrow {
  color: var(--gold-light);
  font-size: 12px;
  letter-spacing: 3px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  line-height: 1.2;
  margin: 12px 0;
}

.hero p {
  max-width: 750px;
  color: var(--muted);
  margin: 0;
}

.section { margin: 30px 0; }

.section-title {
  margin: 0 0 14px;
  font-size: clamp(20px, 3vw, 27px);
}

.section-note {
  color: var(--muted);
  font-size: 13px;
  margin: -7px 0 14px;
}

.steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 16px;
}

.step {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  padding: 9px 4px;
  color: var(--muted);
  font-size: 12px;
}

.step strong {
  display: block;
  color: var(--gold-light);
  font-size: 10px;
}

.step.active {
  background: var(--gold);
  color: #16120a;
  font-weight: bold;
}

.step.active strong { color: #16120a; }

.brand-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.brand-card {
  min-width: 0;
  min-height: 72px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: #fff;
  color: #242424;
  border: 2px solid transparent;
  border-radius: 10px;
  text-align: left;
  box-shadow: 0 2px 6px #0004;
}

.brand-card:hover { border-color: var(--gold); }

.brand-card.selected {
  border-color: var(--red);
  background: #fff1ed;
}

.brand-logo {
  width: 38px;
  height: 38px;
  object-fit: contain;
  flex-shrink: 0;
}

.brand-fallback {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex-shrink: 0;
  background: #eee2bd;
  color: #40300c;
  font-size: 11px;
  font-weight: bold;
}

.brand-name {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.arrow {
  margin-left: auto;
  color: var(--red);
  font-size: 25px;
  font-weight: bold;
}

.panel {
  padding: 20px;
  margin-top: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.field { min-width: 0; }

.full-width { grid-column: 1 / -1; }

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  min-height: 48px;
  background: #fff;
  color: #222;
  border: 1px solid #ccc;
  border-radius: 8px;
}

textarea {
  resize: vertical;
  min-height: 110px;
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--gold);
}

.required {
  display: inline-block;
  background: var(--red);
  color: white;
  border-radius: 4px;
  padding: 2px 5px;
  font-size: 10px;
  margin-left: 5px;
}

.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.choice {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  padding: 13px;
  background: white;
  color: #222;
  border: 2px solid transparent;
  border-radius: 9px;
  text-align: left;
  font-weight: bold;
}

.choice::after {
  content: "›";
  color: var(--red);
  font-size: 24px;
  line-height: 1;
}

.choice:hover { border-color: var(--gold); }

.choice.selected {
  border-color: var(--red);
  background: #fff0ec;
}

.hint {
  font-size: 12px;
  color: var(--muted);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.btn {
  min-height: 48px;
  padding: 12px 20px;
  border-radius: 8px;
  border: 1px solid var(--gold);
  background: var(--gold);
  color: #16120a;
  font-weight: bold;
}

.btn.secondary {
  background: transparent;
  color: var(--gold-light);
}

.btn:disabled {
  opacity: .6;
  cursor: wait;
}

.status {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
}

.status.success {
  display: block;
  background: #173a29;
  color: #d9ffe6;
}

.status.error {
  display: block;
  background: #471d1d;
  color: #ffe0e0;
}

footer {
  text-align: center;
  padding: 25px 15px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
}

footer strong {
  color: var(--gold-light);
  letter-spacing: 2px;
  font-size: 17px;
}

@media (min-width: 720px) {
  .brand-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .choices { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 500px) {
  .header-inner { padding: 10px; }
  .brand { font-size: 14px; gap: 6px; }
  .brand-icon { width: 34px; height: 34px; }
  .language-switch button { padding: 7px; font-size: 12px; }
  .brand-grid { gap: 7px; }
  .brand-card { gap: 7px; padding: 8px; }
  .brand-logo, .brand-fallback { width: 30px; height: 30px; }
  .brand-name { font-size: 12px; }
  .field-grid { grid-template-columns: 1fr; }
  .full-width { grid-column: auto; }
  .steps { gap: 4px; }
  .step { font-size: 10px; }
}
</style>
</head>

<header>
  <div class="header-inner">
    <a class="brand" href="#">
      <span class="brand-icon">AR</span>
      <span>AR AUTO TRADING</span>
    </a>

    <nav class="language-switch" aria-label="Language">
      <button type="button" id="jaButton" class="active">日本語</button>
      <button type="button" id="enButton">English</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow" data-i18n="eyebrow">車両お問い合わせ</div>
    <h1 data-i18n="heroTitle">お探しの車をお知らせください</h1>
    <p data-i18n="heroText">
      メーカー・車種・年式・走行距離を選択してお問い合わせください。
    </p>
  </section>

  <section class="section" id="vehicleSection">
    <h2 class="section-title" data-i18n="makerTitle">
      STEP 1 — メーカーを選択
    </h2>
    <p class="section-note" data-i18n="makerNote">
      メーカーのロゴまたは名前を選択してください。
    </p>

    <div class="steps">
      <div class="step active" id="step1">
        <strong>STEP 1</strong><span data-i18n="maker">メーカー</span>
      </div>
      <div class="step" id="step2">
        <strong>STEP 2</strong><span data-i18n="model">車種</span>
      </div>
      <div class="step" id="step3">
        <strong>STEP 3</strong><span data-i18n="year">年式</span>
      </div>
      <div class="step" id="step4">
        <strong>STEP 4</strong><span data-i18n="mileage">走行距離</span>
      </div>
    </div>

    <div id="brandGrid" class="brand-grid"></div>

    <div class="panel">
      <div class="field-grid">
        <div class="field">
          <label for="modelSelect" data-i18n="modelLabel">
            車種 <span class="required">必須</span>
          </label>
          <select id="modelSelect" required disabled>
            <option value="">先にメーカーを選択してください</option>
          </select>
        </div>

        <div class="field" id="customModelField" hidden>
          <label for="customModel" data-i18n="customModelLabel">
            その他の車種
          </label>
          <input id="customModel" type="text">
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title" data-i18n="yearTitle">
      STEP 3 — 年式を選択
    </h2>
    <div id="yearChoices" class="choices"></div>
  </section>

  <section class="section">
    <h2 class="section-title" data-i18n="mileageTitle">
      STEP 4 — 走行距離を選択
    </h2>
    <div id="mileageChoices" class="choices"></div>
  </section>

  <section class="section">
    <h2 class="section-title" data-i18n="contactTitle">
      お問い合わせ情報
    </h2>

    <form id="enquiryForm" class="panel">
      <div class="field-grid">
        <div class="field">
          <label for="customerName" data-i18n="nameLabel">
            お名前 <span class="required">必須</span>
          </label>
          <input id="customerName" name="name" required autocomplete="name">
        </div>

        <div class="field">
          <label for="customerContact" data-i18n="contactLabel">
            電話番号またはメールアドレス <span class="required">必須</span>
          </label>
          <input id="customerContact" name="contact" required>
        </div>

        <div class="field full-width">
          <label for="details" data-i18n="detailsLabel">
            詳細・ご希望
          </label>
          <textarea id="details" name="details"></textarea>
        </div>

        <div class="field full-width">
          <label for="photos" data-i18n="photosLabel">
            写真（最大5枚、各10MBまで）
          </label>
          <input id="photos" name="photos" type="file"
                 accept="image/*" multiple>
          <p class="hint" data-i18n="photosHint">
            写真はお問い合わせに添付されます。
          </p>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="submitButton" type="submit"
                data-i18n="submit">お問い合わせを送信</button>
        <button class="btn secondary" type="reset"
                data-i18n="reset">リセット</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </section>
</main>

<footer>
  <strong>AR AUTO TRADING</strong>
  <br>
  <span data-i18n="footerText">お問い合わせありがとうございます。</span>
</footer>

/* -------------------------------------------------------
   HELPERS AND LANGUAGE SWITCH
   ------------------------------------------------------- */

function tr(key) {
  return translations[currentLanguage][key] || key;
}

function applyLanguage(language) {
  currentLanguage = language;
  document.documentElement.lang = language;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;
    if (translations[language][key] !== undefined) {
      element.innerHTML = translations[language][key];
    }
  });

  document.getElementById("jaButton").classList.toggle(
    "active", language === "ja"
  );

  document.getElementById("enButton").classList.toggle(
    "active", language === "en"
  );

  document.getElementById("details").placeholder =
    tr("detailsPlaceholder");

  document.getElementById("customModel").placeholder =
    tr("customModelPlaceholder");

  renderManufacturers();
  renderModels();
  renderYears();
  renderMileage();

  try {
    localStorage.setItem("arAutoLanguage", language);
  } catch (error) {}
}

document.getElementById("jaButton").addEventListener(
  "click", () => applyLanguage("ja")
);

document.getElementById("enButton").addEventListener(
  "click", () => applyLanguage("en")
);


/* -------------------------------------------------------
   MANUFACTURER GRID
   ------------------------------------------------------- */

function initials(name) {
  if (name === "Mercedes-Benz") return "MB";
  if (name === "Mitsubishi FUSO") return "FUSO";
  if (name === "UD Trucks") return "UD";

  return name
    .split(/[\s-]+/)
    .map(part => part.charAt(0))
    .join("")
    .slice(0, 4)
    .toUpperCase();
}

function renderManufacturers() {
  const grid = document.getElementById("brandGrid");
  grid.innerHTML = "";

  manufacturers.forEach(([english, japanese, domain]) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "brand-card";

    if (selectedManufacturer === english) {
      button.classList.add("selected");
    }

    button.setAttribute(
      "aria-pressed",
      String(selectedManufacturer === english)
    );

    if (domain) {
      const logo = document.createElement("img");

      logo.className = "brand-logo";
      logo.alt = "";
      logo.loading = "lazy";

      logo.src =
        "https://www.google.com/s2/favicons?domain=" +
        encodeURIComponent(domain) + "&sz=128";

      logo.onerror = function () {
        const fallback = document.createElement("span");
        fallback.className = "brand-fallback";
        fallback.textContent = initials(english);
        this.replaceWith(fallback);
      };

      button.appendChild(logo);
    } else {
      const fallback = document.createElement("span");
      fallback.className = "brand-fallback";
      fallback.textContent = "…";
      button.appendChild(fallback);
    }

    const name = document.createElement("span");
    name.className = "brand-name";
    name.textContent =
      currentLanguage === "ja" ? japanese : english;

    button.appendChild(name);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "›";
    button.appendChild(arrow);

    button.addEventListener("click", () => {
      selectedManufacturer = english;
      selectedYear = "";
      selectedMileage = "";

      renderManufacturers();
      renderModels();
      renderYears();
      renderMileage();
      updateStep(2);
    });

    grid.appendChild(button);
  });
}


/* -------------------------------------------------------
   MODEL DROPDOWN
   ------------------------------------------------------- */

const modelSelect = document.getElementById("modelSelect");
const customModelField = document.getElementById("customModelField");
const customModelInput = document.getElementById("customModel");

function renderModels() {
  modelSelect.innerHTML = "";

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = selectedManufacturer
    ? tr("selectModel")
    : tr("selectMaker");

  modelSelect.appendChild(placeholder);

  const list = (modelLists[selectedManufacturer] || "")
    .split("|")
    .filter(Boolean);

  list.forEach(model => {
    const option = document.createElement("option");
    option.value = model;
    option.textContent = model;
    modelSelect.appendChild(option);
  });

  const otherOption = document.createElement("option");
  otherOption.value = "__other__";
  otherOption.textContent = tr("otherModel");
  modelSelect.appendChild(otherOption);

  modelSelect.disabled = !selectedManufacturer;
  customModelField.hidden = true;
  customModelInput.value = "";
}

modelSelect.addEventListener("change", () => {
  customModelField.hidden = modelSelect.value !== "__other__";
  updateStep(3);
});


/* -------------------------------------------------------
   YEAR SELECTOR: 2026 DOWN TO 1960

   Japanese era labels:
   Reiwa: 2019 onward
   Heisei: 1989–2019
   Showa: 1926–1989
   ------------------------------------------------------- */

function japaneseEra(year) {
  if (year === 2019) return "平成31年／令和元年";

  if (year >= 2019) {
    return "令和" + (year - 2018) + "年";
  }

  if (year >= 1989) {
    return "平成" + (year - 1988) + "年";
  }

  if (year >= 1926) {
    return "昭和" + (year - 1925) + "年";
  }

  return String(year);
}

function renderYears() {
  const container = document.getElementById("yearChoices");
  container.innerHTML = "";

  for (let year = 2026; year >= 1960; year--) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice";

    if (selectedYear === String(year)) {
      button.classList.add("selected");
    }

    button.textContent = currentLanguage === "ja"
      ? `${japaneseEra(year)}（${year}年）`
      : String(year);

    button.addEventListener("click", () => {
      selectedYear = String(year);
      renderYears();
      updateStep(4);
    });

    container.appendChild(button);
  }
}


/* -------------------------------------------------------
   MILEAGE SELECTOR: 20,000 KM TO 300,000 KM+
   ------------------------------------------------------- */

const mileageValues = [
  20000, 40000, 60000, 80000, 100000,
  120000, 140000, 160000, 180000, 200000,
  220000, 240000, 260000, 280000, 300000,
  "over", "unknown"
];

function mileageLabel(value) {
  if (value === "over") return tr("overMileage");
  if (value === "unknown") return tr("unknownMileage");

  if (currentLanguage === "ja") {
    return (value / 10000).toLocaleString("ja-JP") + "万Km以下";
  }

  return "Up to " + value.toLocaleString("en-US") + " km";
}

function renderMileage() {
  const container = document.getElementById("mileageChoices");
  container.innerHTML = "";

  mileageValues.forEach(value => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice";

    if (selectedMileage === String(value)) {
      button.classList.add("selected");
    }

    button.textContent = mileageLabel(value);

    button.addEventListener("click", () => {
      selectedMileage = String(value);
      renderMileage();
      updateStep(4);
    });

    container.appendChild(button);
  });
}


/* -------------------------------------------------------
   STEP INDICATOR
   ------------------------------------------------------- */

function updateStep(activeStep) {
  for (let number = 1; number <= 4; number++) {
    document.getElementById("step" + number)
      .classList.toggle("active", number === activeStep);
  }
}


/* -------------------------------------------------------
   SUPABASE PRIVATE PHOTO UPLOAD
   Private object paths are stored in photo_urls.
   No public URLs are generated.
   ------------------------------------------------------- */

function safeFilename(name) {
  return name
    .normalize("NFKD")
    .replace(/[^a-zA-Z0-9._-]/g, "_")
    .slice(-100) || "photo";
}

async function uploadPhoto(file) {
  const randomId = crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);

  const path =
    "enquiries/" + Date.now() + "-" +
    randomId + "-" + safeFilename(file.name);

  const response = await fetch(
    STORAGE_URL + "/" +
    path.split("/").map(encodeURIComponent).join("/"),
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": file.type || "application/octet-stream",
        "x-upsert": "false"
      },
      body: file
    }
  );

  if (!response.ok) {
    throw new Error("photo-upload");
  }

  return path;
}


/* -------------------------------------------------------
   FORM SUBMISSION
   Uses the existing vehicle_enquiries table columns:
   name, contact, maker, model, year, mileage,
   details, photo_urls, created_at
   ------------------------------------------------------- */

function showStatus(message, type) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.className = "status " + type;
}

document.getElementById("enquiryForm")
  .addEventListener("submit", async function (event) {
    event.preventDefault();

    const model = modelSelect.value === "__other__"
      ? customModelInput.value.trim()
      : modelSelect.value;

    if (!selectedManufacturer) {
      showStatus(tr("needMaker"), "error");
      document.getElementById("vehicleSection")
        .scrollIntoView({ behavior: "smooth" });
      return;
    }

    if (!model) {
      showStatus(tr("needModel"), "error");
      modelSelect.focus();
      return;
    }

    if (!selectedYear) {
      showStatus(tr("needYear"), "error");
      document.getElementById("yearChoices")
        .scrollIntoView({ behavior: "smooth" });
      return;
    }

    if (!selectedMileage) {
      showStatus(tr("needMileage"), "error");
      document.getElementById("mileageChoices")
        .scrollIntoView({ behavior: "smooth" });
      return;
    }

    const files = Array.from(
      document.getElementById("photos").files || []
    );

    if (files.length > 5) {
      showStatus(tr("tooMany"), "error");
      return;
    }

    if (files.some(file => file.size > 10 * 1024 * 1024)) {
      showStatus(tr("tooLarge"), "error");
      return;
    }

    const submitButton = document.getElementById("submitButton");
    submitButton.disabled = true;
    submitButton.textContent = tr("sending");

    try {
      const photoPaths = [];

      for (const file of files) {
        photoPaths.push(await uploadPhoto(file));
      }

      const mileageNumber =
        selectedMileage === "unknown"
          ? null
          : selectedMileage === "over"
            ? 300001
            : Number(selectedMileage);

      let details = document.getElementById("details").value.trim();

      if (selectedMileage === "over") {
        details += (details ? "\n" : "") +
          "Mileage: over 300,000 km";
      }

      if (selectedMileage === "unknown") {
        details += (details ? "\n" : "") +
          "Mileage: unknown";
      }

      const payload = {
        name: document.getElementById("customerName").value.trim(),
        contact: document.getElementById("customerContact").value.trim(),
        maker: selectedManufacturer,
        model: model,
        year: Number(selectedYear),
        mileage: mileageNumber,
        details: details,
        photo_urls: photoPaths,
        created_at: new Date().toISOString()
      };

      const response = await fetch(TABLE_URL, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        console.error("Supabase table error:", await response.text());
        throw new Error("submission");
      }

      showStatus(tr("success"), "success");

      this.reset();

      selectedManufacturer = "";
      selectedYear = "";
      selectedMileage = "";

      renderManufacturers();
      renderModels();
      renderYears();
      renderMileage();
      updateStep(1);

    } catch (error) {
      console.error(error);

      showStatus(
        error.message === "photo-upload"
          ? tr("uploadError")
          : tr("submitError"),
        "error"
      );

    } finally {
      submitButton.disabled = false;
      submitButton.textContent = tr("submit");
    }
  });


/* -------------------------------------------------------
   RESET FORM
   ------------------------------------------------------- */

document.getElementById("enquiryForm")
  .addEventListener("reset", function () {
    setTimeout(() => {
      selectedManufacturer = "";
      selectedYear = "";
      selectedMileage = "";

      renderManufacturers();
      renderModels();
      renderYears();
      renderMileage();
      updateStep(1);

      document.getElementById("status").className = "status";
    }, 0);
});


/* -------------------------------------------------------
   INITIALIZE

   Japanese is the default for a first-time visitor.
   Remember the customer's language choice on this device.
   ------------------------------------------------------- */

try {
  const savedLanguage = localStorage.getItem("arAutoLanguage");

  if (savedLanguage === "en") {
    currentLanguage = "en";
  }
} catch (error) {}

renderManufacturers();
renderModels();
renderYears();
renderMileage();

if (currentLanguage === "en") {
  applyLanguage("en");
}
</script>
