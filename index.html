<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>AR AUTO TRADING</title>

<style>
:root {
  --bg: #101010;
  --panel: #1b1b1b;
  --gold: #d9b45b;
  --gold-light: #f3dda0;
  --text: #f8f5ed;
  --muted: #bdb7a9;
  --border: #403725;
  --input: #fffbd7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", sans-serif;
  line-height: 1.6;
}

button, input, select, textarea { font: inherit; }

header {
  background: #111;
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 760px;
  margin: auto;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  color: var(--gold-light);
  font-size: clamp(16px, 4vw, 24px);
  font-weight: 900;
  letter-spacing: 1px;
}

.brand-icon {
  display: inline-grid;
  place-items: center;
  width: 37px;
  height: 37px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  margin-right: 7px;
}

.language {
  display: flex;
  gap: 5px;
}

.language button {
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #222;
  color: white;
}

.language button.active {
  background: var(--gold);
  color: #17130a;
  font-weight: bold;
}

main {
  max-width: 760px;
  margin: auto;
  padding: 18px 16px 45px;
}

.hero {
  text-align: center;
  padding: 28px 16px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: radial-gradient(ellipse at top, #40351e, #151515 75%);
}

.hero h1 {
  margin: 0 0 8px;
  color: var(--gold-light);
  font-size: clamp(24px, 5vw, 34px);
}

.hero p {
  margin: 0;
  color: var(--muted);
}

.form-card {
  margin-top: 22px;
  padding: 22px 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
}

.heading {
  margin: 0 0 22px;
  text-align: center;
  font-size: 21px;
  color: var(--gold-light);
}

.progress {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 22px;
}

.progress div {
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 3px;
  color: var(--muted);
  font-size: 12px;
}

.progress div.active {
  background: var(--gold);
  color: #15110a;
  border-color: var(--gold);
  font-weight: bold;
}

.step { display: none; }
.step.active { display: block; }

.field { margin-bottom: 18px; }

label {
  display: block;
  margin-bottom: 8px;
  font-size: 18px;
  font-weight: bold;
}

.required {
  display: inline-block;
  padding: 2px 7px;
  margin-right: 5px;
  border-radius: 4px;
  background: #bb3434;
  color: white;
  font-size: 12px;
  vertical-align: 2px;
}

select, input, textarea {
  width: 100%;
  min-height: 58px;
  padding: 13px 15px;
  border: 1px solid #a99c68;
  border-radius: 9px;
  background: var(--input);
  color: #252115;
  font-size: 17px;
}

select:disabled {
  opacity: .65;
  cursor: not-allowed;
}

input, textarea { background: #fff; }

textarea {
  min-height: 100px;
  resize: vertical;
}

select:focus, input:focus, textarea:focus {
  outline: 2px solid var(--gold);
}

.btn {
  width: 100%;
  min-height: 57px;
  padding: 14px;
  margin-top: 8px;
  border: 1px solid var(--gold-light);
  border-radius: 8px;
  background: linear-gradient(#f0d27e, #c69b3d);
  color: #191307;
  font-size: 21px;
  font-weight: 900;
  box-shadow: 0 3px 0 #75551e;
  cursor: pointer;
}

.btn:disabled {
  opacity: .6;
  cursor: wait;
}

.btn.secondary {
  background: transparent;
  color: var(--gold-light);
  border-color: var(--border);
  box-shadow: none;
  font-size: 16px;
}

.security {
  margin-top: 24px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.security strong {
  display: block;
  margin-bottom: 4px;
  color: var(--gold-light);
  font-size: 17px;
}

.error {
  display: none;
  margin-top: 6px;
  color: #ff8c83;
  font-size: 13px;
}

.status {
  display: none;
  padding: 13px;
  margin-top: 16px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.status.success {
  display: block;
  background: #173a29;
  color: #d9ffe6;
}

.status.error {
  display: block;
  background: #471d1d;
  color: #ffe0e0;
}

.review-row {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.review-row strong {
  display: block;
  color: var(--gold-light);
}

.promo {
  margin-top: 28px;
  padding: 27px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, #292214, #111);
  text-align: center;
}

.promo h2 {
  margin: 0 0 8px;
  color: var(--gold-light);
}

.promo p {
  margin: 0;
  color: var(--muted);
}

footer {
  padding: 25px 12px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

footer strong {
  display: block;
  color: var(--gold-light);
  font-size: 20px;
  letter-spacing: 1px;
}

@media (max-width: 390px) {
  .header-inner { padding: 12px 9px; }
  .brand { font-size: 14px; letter-spacing: 0; }
  .brand-icon { width: 30px; height: 30px; }
  .language button { padding: 6px; font-size: 12px; }
  .form-card { padding: 18px 13px; }
  label { font-size: 16px; }
}
</style>
</head>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">AR</span>AR AUTO TRADING
    </div>

    <div class="language">
      <button id="jaButton" class="active" type="button">日本語</button>
      <button id="enButton" type="button">English</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1 data-i18n="heroTitle">無料車両査定</h1>
    <p data-i18n="heroText">お車の情報を入力してお問い合わせください。</p>
  </section>

  <form id="enquiryForm" class="form-card">
    <h2 class="heading" data-i18n="formHeading">ご利用の愛車について</h2>

    <div class="progress">
      <div id="progress1" class="active" data-i18n="progress1">車両情報</div>
      <div id="progress2" data-i18n="progress2">お客様情報</div>
      <div id="progress3" data-i18n="progress3">確認・送信</div>
    </div>

    <!-- STEP 1 -->
    <section id="step1" class="step active">

      <div class="field">
        <label for="maker">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="makerLabel">メーカー</span>
        </label>
        <select id="maker" required>
          <option value="" data-i18n="makerPlaceholder">メーカーを選択</option>
        </select>
        <div id="makerError" class="error"></div>
      </div>

      <div class="field">
        <label for="model">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="modelLabel">車種</span>
        </label>
        <select id="model" required disabled>
          <option value="" data-i18n="modelPlaceholder">先にメーカーを選択してください</option>
        </select>
        <div id="modelError" class="error"></div>
      </div>

      <div class="field" id="otherModelField" hidden>
        <label for="otherModel" data-i18n="otherModelLabel">その他の車種</label>
        <input id="otherModel" type="text">
      </div>

      <div class="field">
        <label for="year">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="yearLabel">年式</span>
        </label>
        <select id="year" required>
          <option value="" data-i18n="yearPlaceholder">年式を選択</option>
        </select>
        <div id="yearError" class="error"></div>
      </div>

      <div class="field">
        <label for="mileage">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="mileageLabel">走行距離</span>
        </label>
        <select id="mileage" required>
          <option value="" data-i18n="mileagePlaceholder">走行距離を選択</option>
        </select>
        <div id="mileageError" class="error"></div>
      </div>

      <button type="button" class="btn" id="next1" data-i18n="next">次へ</button>

      <div class="security">
        <strong data-i18n="securityTitle">🔒 SSL暗号化通信</strong>
        <span data-i18n="securityText">
          お客様の個人情報はお問い合わせへの対応に使用します。
        </span>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="step">
      <div class="field">
        <label for="customerName">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="nameLabel">お名前</span>
        </label>
        <input id="customerName" autocomplete="name" required>
        <div id="nameError" class="error"></div>
      </div>

      <div class="field">
        <label for="contact">
          <span class="required" data-i18n="required">必須</span>
          <span data-i18n="contactLabel">電話番号またはメールアドレス</span>
        </label>
        <input id="contact" required>
        <div id="contactError" class="error"></div>
      </div>

      <div class="field">
        <label for="details" data-i18n="detailsLabel">詳細・ご希望</label>
        <textarea id="details"></textarea>
      </div>

      <div class="field">
        <label for="photos" data-i18n="photosLabel">車両写真（最大5枚）</label>
        <input id="photos" type="file" accept="image/*" multiple>
        <small data-i18n="photosHint">各画像は10MB以下にしてください。</small>
      </div>

      <button type="button" class="btn" id="next2" data-i18n="next">次へ</button>
      <button type="button" class="btn secondary" id="back2" data-i18n="back">戻る</button>
    </section>

    <!-- STEP 3 -->
    <section id="step3" class="step">
      <h3 data-i18n="reviewHeading">入力内容をご確認ください</h3>
      <div id="review"></div>

      <button type="submit" class="btn" id="submitButton" data-i18n="submit">
        無料査定を申し込む
      </button>

      <button type="button" class="btn secondary" id="back3" data-i18n="back">
        戻る
      </button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>

  <section class="promo">
    <h2 data-i18n="promoTitle">AR AUTO TRADING</h2>
    <p data-i18n="promoText">車両に関するお問い合わせはこちらから。</p>
  </section>
</main>

<footer>
  <strong>AR AUTO TRADING</strong>
  <span data-i18n="footerText">無料車両査定・お問い合わせ</span>
</footer>

let language = "ja";
let currentStep = 1;

function t(key) {
  return translations[language][key] || key;
}

/* Populate manufacturers */
function populateMakers() {
  const select = document.getElementById("maker");
  const old = select.value;
  select.innerHTML = "";

  addOption(select, "", t("makerPlaceholder"));

  Object.entries(vehicles).forEach(([key, data]) => {
    addOption(select, key, language === "ja" ? data.ja : key);
  });

  select.value = old;
}

/* Models depend on the selected manufacturer */
function populateModels() {
  const maker = document.getElementById("maker").value;
  const select = document.getElementById("model");
  const old = select.value;

  select.innerHTML = "";
  addOption(select, "", t("modelPlaceholder"));

  if (!maker || !vehicles[maker]) {
    select.disabled = true;
    document.getElementById("otherModelField").hidden = true;
    return;
  }

  select.disabled = false;

  vehicles[maker].models.forEach(model => {
    const display = model === "Other"
      ? (language === "ja" ? "その他（車種を入力）" : "Other (enter model)")
      : model;

    addOption(select, model, display);
  });

  if ([...select.options].some(option => option.value === old)) {
    select.value = old;
  }

  document.getElementById("otherModelField").hidden =
    select.value !== "Other";
}

function addOption(select, value, text) {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = text;
  select.appendChild(option);
}

document.getElementById("maker").addEventListener("change", () => {
  populateModels();
  clearErrors();
});

document.getElementById("model").addEventListener("change", () => {
  document.getElementById("otherModelField").hidden =
    document.getElementById("model").value !== "Other";
});

/* Japanese era names */
function japaneseEra(year) {
  if (year === 2019) return "平成31年／令和元年";
  if (year >= 2019) return "令和" + (year - 2018) + "年";
  if (year >= 1989) return "平成" + (year - 1988) + "年";
  return "昭和" + (year - 1925) + "年";
}

function populateYears() {
  const select = document.getElementById("year");
  const old = select.value;
  select.innerHTML = "";
  addOption(select, "", t("yearPlaceholder"));

  for (let year = 2026; year >= 1960; year--) {
    addOption(
      select,
      String(year),
      language === "ja"
        ? japaneseEra(year) + "（" + year + "年）"
        : String(year)
    );
  }

  select.value = old;
}

/* Mileage: every 10,000 km from 20,000 to 300,000 */
function populateMileage() {
  const select = document.getElementById("mileage");
  const old = select.value;
  select.innerHTML = "";
  addOption(select, "", t("mileagePlaceholder"));

  for (let km = 20000; km <= 300000; km += 10000) {
    const label = language === "ja"
      ? (km / 10000) + "万Km以下"
      : "Up to " + km.toLocaleString("en-US") + " km";

    addOption(select, String(km), label);
  }

  addOption(select, "over", t("over"));
  addOption(select, "unknown", t("unknown"));
  select.value = old;
}

/* Language switch */
function setLanguage(lang) {
  language = lang;
  document.documentElement.lang = lang;

  document.getElementById("jaButton").classList.toggle("active", lang === "ja");
  document.getElementById("enButton").classList.toggle("active", lang === "en");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[lang][key] !== undefined) {
      el.textContent = translations[lang][key];
    }
  });

  populateMakers();
  populateModels();
  populateYears();
  populateMileage();
}

document.getElementById("jaButton").onclick = () => setLanguage("ja");
document.getElementById("enButton").onclick = () => setLanguage("en");

/* Step navigation */
function showStep(number) {
  currentStep = number;

  for (let i = 1; i <= 3; i++) {
    document.getElementById("step" + i).classList.toggle("active", i === number);
    document.getElementById("progress" + i).classList.toggle("active", i === number);
  }

  document.querySelector(".form-card").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function clearErrors() {
  document.querySelectorAll(".error").forEach(el => {
    el.textContent = "";
    el.style.display = "none";
  });
}

function showError(id, message) {
  const el = document.getElementById(id);
  el.textContent = message;
  el.style.display = "block";
}

document.getElementById("next1").onclick = () => {
  clearErrors();

  if (!document.getElementById("maker").value) {
    showError("makerError", t("needMaker"));
    return;
  }

  if (!document.getElementById("model").value) {
    showError("modelError", t("needModel"));
    return;
  }

  if (document.getElementById("model").value === "Other" &&
      !document.getElementById("otherModel").value.trim()) {
    showError("modelError", t("needModel"));
    return;
  }

  if (!document.getElementById("year").value) {
    showError("yearError", t("needYear"));
    return;
  }

  if (!document.getElementById("mileage").value) {
    showError("mileageError", t("needMileage"));
    return;
  }

  showStep(2);
};

document.getElementById("next2").onclick = () => {
  clearErrors();

  if (!document.getElementById("customerName").value.trim()) {
    showError("nameError", t("needName"));
    return;
  }

  if (!document.getElementById("contact").value.trim()) {
    showError("contactError", t("needContact"));
    return;
  }

  const photos = [...document.getElementById("photos").files];

  if (photos.length > 5) {
    showError("contactError", t("tooMany"));
    return;
  }

  if (photos.some(file => file.size > 10 * 1024 * 1024)) {
    showError("contactError", t("tooLarge"));
    return;
  }

  renderReview();
  showStep(3);
};

document.getElementById("back2").onclick = () => showStep(1);
document.getElementById("back3").onclick = () => showStep(2);

function selectedText(id) {
  const select = document.getElementById(id);
  return select.options[select.selectedIndex]?.textContent || "";
}

function renderReview() {
  const box = document.getElementById("review");
  box.innerHTML = "";

  const data = [
    ["Manufacturer", selectedText("maker")],
    ["Model", document.getElementById("model").value === "Other"
      ? document.getElementById("otherModel").value.trim()
      : selectedText("model")],
    ["Year", selectedText("year")],
    ["Mileage", selectedText("mileage")],
    ["Name", document.getElementById("customerName").value.trim()],
    ["Contact", document.getElementById("contact").value.trim()],
    ["Details", document.getElementById("details").value.trim() || "—"],
    ["Photos", String(document.getElementById("photos").files.length)]
  ];

  data.forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "review-row";

    const label = document.createElement("strong");
    label.textContent = key;

    const content = document.createElement("span");
    content.textContent = value;

    row.append(label, content);
    box.appendChild(row);
  });
}

/* Private photo upload: save only storage paths, not public URLs */
function safeFilename(name) {
  return name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-100) || "photo";
}

async function uploadPhoto(file) {
  const id = crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now() + "-" + Math.random().toString(36).slice(2);

  const path = "enquiries/" + id + "-" + safeFilename(file.name);

  const response = await fetch(
    STORAGE_URL + "/" + path.split("/").map(encodeURIComponent).join("/"),
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": file.type || "application/octet-stream",
        "x-upsert": "false"
      },
      body: file
    }
  );

  if (!response.ok) throw new Error("Photo upload failed");
  return path;
}

function setStatus(message, type) {
  const el = document.getElementById("status");
  el.textContent = message;
  el.className = "status " + type;
}

document.getElementById("enquiryForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = document.getElementById("submitButton");
  button.disabled = true;
  button.textContent = t("sending");

  try {
    const makerKey = document.getElementById("maker").value;
    const makerData = vehicles[makerKey];
    const modelValue = document.getElementById("model").value;

    const modelName = modelValue === "Other"
      ? document.getElementById("otherModel").value.trim()
      : modelValue;

    const mileageValue = document.getElementById("mileage").value;

    const mileage = mileageValue === "unknown"
      ? null
      : mileageValue === "over"
        ? 300001
        : Number(mileageValue);

    let details = document.getElementById("details").value.trim();

    if (mileageValue === "over") {
      details += (details ? "\n" : "") + "Mileage over 300,000 km";
    }

    if (mileageValue === "unknown") {
      details += (details ? "\n" : "") + "Mileage unknown";
    }

    const photoPaths = [];

    for (const file of document.getElementById("photos").files) {
      photoPaths.push(await uploadPhoto(file));
    }

    const payload = {
      name: document.getElementById("customerName").value.trim(),
      contact: document.getElementById("contact").value.trim(),
      maker: language === "ja" ? makerData.ja : makerKey,
      model: modelName,
      year: Number(document.getElementById("year").value),
      mileage: mileage,
      details: details,
      photo_urls: photoPaths,
      created_at: new Date().toISOString()
    };

    const response = await fetch(TABLE_URL, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      console.error("Supabase error:", await response.text());
      throw new Error("Submission failed");
    }

    setStatus(t("success"), "success");
    button.textContent = t("success");

  } catch (error) {
    console.error(error);
    setStatus(t("failure"), "error");
    button.disabled = false;
    button.textContent = t("submit");
  }
});

/* Start in Japanese */
setLanguage("ja");
showStep(1);
</script>
