<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | AR AUTO TRADING</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { --bg-dark: #050505; --panel: #111; --gold: #cda34f; --text: #fff; --text-muted: #aaa; --border: rgba(205, 163, 79, 0.3); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; }
    h1, h2, h3 { font-family: 'Cinzel', serif; color: var(--gold); }
    
    /* LOGIN */
    #login-view { max-width: 400px; margin: 100px auto; background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    /* DASHBOARD */
    #dashboard-view { display: none; max-width: 1200px; margin: auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .logout-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); width: auto; padding: 8px 15px; }
    
    .enquiry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .enquiry-card { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
    .enquiry-card p { margin-bottom: 8px; font-size: 14px; }
    .enquiry-card strong { color: var(--gold); }
    .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .photos a { display: block; width: 80px; height: 80px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .photos img { width: 100%; height: 100%; object-fit: cover; }
    .loading { text-align: center; color: var(--gold); margin-top: 50px; font-size: 18px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-view">
    <h2>Admin Login</h2>
    <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Restricted Access</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="login-error" style="color: red; margin-top: 10px; font-size: 12px;"></p>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-view">
    <div class="header-bar">
      <h2>Enquiries</h2>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div id="loading" class="loading">Loading data...</div>
    <div class="enquiry-grid" id="enquiry-list">
      <!-- Cards will appear here -->
    </div>
  </div>

  <script>
    // --- INIT ---
    const supabaseUrl = 'https://wgxjmqqpdnzxodacvucq.supabase.co';
    const supabaseKey = 'sb_publishable_1jkh0BxfGfW7StQFGeC8Ig_O3gvj0PZ';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Check if user is already logged in
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        loadEnquiries();
      } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('dashboard-view').style.display = 'none';
      }
    });

    // --- LOGIN ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      errorEl.textContent = 'Logging in...';
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        errorEl.textContent = error.message;
      } else {
        errorEl.textContent = '';
      }
    });

    // --- LOGOUT ---
    async function logout() {
      await supabase.auth.signOut();
    }

    // --- LOAD DATA ---
    async function loadEnquiries() {
      document.getElementById('loading').style.display = 'block';
      const list = document.getElementById('enquiry-list');
      list.innerHTML = '';

      const { data, error } = await supabase
        .from('enquiries')
        .select('*')
        .order('created_at', { ascending: false });

      document.getElementById('loading').style.display = 'none';

      if (error) {
        alert('Error loading data: ' + error.message);
        return;
      }

      if (data.length === 0) {
        list.innerHTML = '<p style="color:#aaa;">No enquiries yet.</p>';
        return;
      }

      data.forEach(item => {
        let photosHtml = '';
        if (item.photo_urls && item.photo_urls.length > 0) {
          item.photo_urls.forEach(url => {
            photosHtml += `<a href="${url}" target="_blank"><img src="${url}"></a>`;
          });
        } else {
          photosHtml = '<p style="color:#aaa; font-size:12px;">No photos uploaded.</p>';
        }

        const date = new Date(item.created_at).toLocaleString();

        const card = document.createElement('div');
        card.className = 'enquiry-card';
        card.innerHTML = `
          <p><strong>Date:</strong> ${date}</p>
          <p><strong>Name:</strong> ${item.name}</p>
          <p><strong>Contact:</strong> ${item.contact}</p>
          <p><strong>Vehicle:</strong> ${item.maker} ${item.model} (${item.year || 'Year N/A'})</p>
          <p><strong>Mileage:</strong> ${item.mileage || 'N/A'}</p>
          <p><strong>Details:</strong> ${item.details || 'None'}</p>
          <p><strong>Photos:</strong></p>
          <div class="photos">${photosHtml}</div>
        `;
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
